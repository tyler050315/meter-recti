workflows:
  ios-unsigned-check:
    name: iOS unsigned build check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build native scanner bridge
        script: npm run build:native-scanner
      - name: Prepare Capacitor web assets
        script: npm run prepare:www
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Build iOS simulator app without signing
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - ios/App/build/Build/Products/**/*.app
  ios-unsigned-device-ipa:
    name: iOS unsigned device IPA for sideloading
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build native scanner bridge
        script: npm run build:native-scanner
      - name: Prepare Capacitor web assets
        script: npm run prepare:www
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Build iOS device app without signing
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        script: |
          cd ios/App
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          IPA_DIR="build/unsigned-ipa"
          test -d "$APP_PATH"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/App.app"
          cd "$IPA_DIR"
          zip -qry MeterRecti-unsigned-device.ipa Payload
    artifacts:
      - ios/App/build/Build/Products/Release-iphoneos/*.app
      - ios/App/build/unsigned-ipa/*.ipa
